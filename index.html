<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hotel Base-Camp Comparator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="page-header">
        <p class="eyebrow">Fictional City Explorer</p>
        <h1>Hotel Base-Camp Comparator</h1>
        <p class="intro">
          Find the most accessible hotel within your budget and tailor the comparison
          to the places you care about most.
        </p>
      </header>
      <div class="workspace">
        <aside class="sidebar" aria-labelledby="controls-title">
          <h2 id="controls-title">Trip controls</h2>
          <label class="budget-control" for="budget-input">
            <span>Budget</span>
            <span class="input-with-prefix">
              <span aria-hidden="true">$</span>
              <input id="budget-input" type="number" min="0" max="1000000" step="1" />
            </span>
          </label>
          <div class="places-controls">
            <div class="section-heading">
              <h3>Place importance</h3>
              <p>Adjust how much each destination influences the ranking.</p>
            </div>
            <div id="importance-controls"></div>
          </div>
        </aside>
        <section class="results-panel" aria-labelledby="results-title">
          <div class="results-heading">
            <div>
              <p class="eyebrow">Results</p>
              <h2 id="results-title">Hotel rankings</h2>
            </div>
            <p id="data-summary" class="summary" aria-live="polite"></p>
          </div>
          <div id="error-banner" class="error-banner" role="alert" hidden></div>
          <div id="hotel-results" class="hotel-results" aria-live="polite"></div>
        </section>
      </div>
    </main>
    <script src="app.js"></script>
  </body>
</html>
